services:
  yaad-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /data
    volumes:
      - ./data:/data
    ports:
      - "8100:8000"
    restart: unless-stopped

  yaad-frontend:
    build:
      context: ./frontend
    ports:
      - "8180:80"
    depends_on:
      - yaad-backend
    restart: unless-stopped
